name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Check reobfuscated jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -e '-dev' -e '-sources' | head -1)
          echo "jar: $JAR"
          unzip -l "$JAR"
          mkdir -p /tmp/chk && cd /tmp/chk && unzip -q -o "$GITHUB_WORKSPACE/$JAR"
          echo "== ModelPoseMPM =="
          javap -p -c -cp . playerpose.client.ModelPoseMPM | grep -oE "(public|private|protected) [^(]*\(|(Field|Method) [^ ]+" | sort -u
          echo "== PoseRenderHandler / GuiPoseWheel / CommandPose methods =="
          for c in playerpose.client.PoseRenderHandler playerpose.client.GuiPoseWheel playerpose.client.CommandPose playerpose.common.PoseServerHandler; do javap -p -cp . $c; done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: SAE_TrainStaffPose
          path: build/libs/*.jar
