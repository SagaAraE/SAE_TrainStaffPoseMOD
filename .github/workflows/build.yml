name: Build

on:
  push:
    branches: [ main ]
    tags: [ '[0-9]+.[0-9]+.[0-9]+*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Check jar contents
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -e '-dev' -e '-sources' | head -1)
          echo "jar: $JAR"
          unzip -l "$JAR"
          # More Player Models must never be bundled
          if unzip -l "$JAR" | grep -q "noppes/"; then echo "ERROR: MPM classes found in jar"; exit 1; fi

      - name: Package jar and README
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -e '-dev' -e '-sources' | head -1)
          VERSION=$(basename "$JAR" .jar | sed 's/^playerpose-//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp "$JAR" dist/
          sed "s/{VERSION}/$VERSION/g" docs/README.txt > dist/README.txt
          ls -la dist

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: SAE_TrainStaffPose
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SAE TrainStaffPose ${{ env.VERSION }}
          files: dist/*
          body: |
            SAE TrainStaffPose ${{ env.VERSION }}（Minecraft 1.7.10 / Forge）

            ・前提mod：More Player Models 1.7.10b（別途入手してください。このファイルには含まれていません）
            ・サーバーと全クライアントの両方に jar を入れてください。
            ・操作方法などは README.txt を参照してください。

            License: CC BY-NC 3.0 / Author: SagaAraE
